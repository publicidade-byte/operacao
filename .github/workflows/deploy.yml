name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Liga o GitHub Pages automaticamente na primeira execução, sem precisar
      # mexer em Settings. Também expõe a URL final para o passo de deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      # A URL e a publishable key do Supabase têm padrão embutido no código
      # (são públicas). Definir estas variables no repositório só é necessário
      # para apontar o build para outro projeto Supabase.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      # SPA: qualquer rota (/admin, /s/token) precisa cair no index.html
      - run: cp dist/index.html dist/404.html

      # Mantém o domínio próprio configurado no repositório
      - name: Preservar CNAME
        run: if [ -f CNAME ]; then cp CNAME dist/CNAME; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
